name: Build, quality and application-server tests
on:
  push:
    branches: [dev, main, master]
  pull_request:
    branches: [dev, main, master]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit tests, architecture, coverage and static analysis
        run: bash mvnw -B -ntp verify
      - name: Start PostgreSQL and Payara Micro
        run: |
          cp .env.example .env
          docker compose up -d --build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: REST, concurrency and transaction rollback integration tests
        run: python scripts/smoke_test.py
      - name: Collect application logs
        if: always()
        run: docker compose logs --no-color > target/compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/*checkstyle*
            target/*spotbugs*
            target/compose.log
      - name: Stop demo services
        if: always()
        run: docker compose down
  sonar:
    if: github.event_name == 'push' && vars.SONAR_PROJECT_KEY != '' && vars.SONAR_ORGANIZATION != ''
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Analyze and wait for the configured Sonar quality gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          test -n "$SONAR_TOKEN"
          bash mvnw -B -ntp verify org.sonarsource.scanner.maven:sonar-maven-plugin:5.2.0.4988:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.organization="$SONAR_ORGANIZATION" \
            -Dsonar.qualitygate.wait=true
